<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siva Swaminathan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <script src="data.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        paper: 'var(--bg-light)', 
                        midnight: 'var(--bg-dark)' 
                    } 
                } 
            }
        }
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        :root { --bg-light: #f7f2e8; --accent: #8b4513; }
        .dark { --bg-dark: #121212; --accent: #c29b6d; }

        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; transition: background-color 0.4s ease; }
        
        /* UNIFIED SERIF: EB Garamond for everything editorial */
        h1, h2, h3, h4, .serif-body { font-family: 'EB Garamond', serif; }
        
        .text-accent { color: var(--accent); }
        .border-accent { border-color: var(--accent); }
        .bg-accent { background-color: var(--accent); }
        .decoration-accent { text-decoration-color: var(--accent); }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            filter: grayscale(100%) contrast(250%) brightness(95%); mix-blend-mode: multiply; opacity: 0.2;
        }
        .dark body::before { filter: grayscale(100%) brightness(1.2) contrast(300%); mix-blend-mode: overlay; opacity: 0.3; }
        
        .profile-photo { filter: grayscale(100%) contrast(110%) brightness(105%); mix-blend-mode: multiply; opacity: 0.9; }
        .dark .profile-photo { filter: grayscale(100%) contrast(120%) brightness(0.85); mix-blend-mode: luminosity; opacity: 0.8; }
        
        .section-label { letter-spacing: 0.15em; text-transform: uppercase; font-size: 0.8rem; font-weight: 800; }
        .content-fade { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-paper dark:bg-midnight text-slate-900 dark:text-zinc-300 selection:bg-accent selection:text-black">

    <div class="max-w-7xl mx-auto px-8 py-10 md:py-16 content-fade relative">
        <header class="border-b-2 border-slate-900 dark:border-zinc-800 pb-8 mb-12 relative">
            <div class="flex flex-col lg:flex-row items-start lg:items-center gap-12">
                <div class="relative w-48 h-48 lg:w-56 lg:h-56">
                    <div class="absolute -inset-1 bg-gradient-to-r from-slate-200 to-slate-400 dark:from-zinc-800 dark:to-zinc-900 rounded-3xl blur opacity-20"></div>
                    <img id="render-photo" src="" alt="Siva" class="relative profile-photo w-full h-full object-cover rounded-3xl border border-slate-200 dark:border-zinc-800 shadow-lg">
                </div>
                <div class="flex-1">
                    <div class="flex justify-between items-start mb-6">
                        <!-- Name in EB Garamond Medium -->
                        <h1 id="render-name" class="text-6xl md:text-8xl font-medium tracking-tight text-slate-900 dark:text-white"></h1>
                        <button id="theme-toggle" type="button" class="p-3 rounded-xl border border-slate-200 dark:border-zinc-800 hover:bg-slate-50 dark:hover:bg-zinc-900 transition-all">
                            <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 fill-current text-yellow-500" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                            <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 fill-current text-slate-700 dark:text-zinc-400" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                        </button>
                    </div>
                    <p id="render-taglines" class="text-xl md:text-2xl text-slate-500 dark:text-zinc-500 font-light italic mb-6"></p>
                    <div class="flex flex-wrap gap-x-8 gap-y-2 text-[12px] font-bold uppercase tracking-[0.2em]">
                        <a id="link-github" href="#" class="text-accent hover:text-black dark:hover:text-white transition-colors">GitHub</a>
                        <a id="link-twitter" href="#" class="text-accent hover:text-black dark:hover:text-white transition-colors">Twitter</a>
                        <a id="link-email" href="#" class="text-accent hover:text-black dark:hover:text-white transition-colors">Email</a>
                        <a id="link-resume" href="#" class="text-accent hover:text-black dark:hover:text-white transition-colors underline decoration-accent underline-offset-8">Resume</a>
                    </div>
                </div>
            </div>
        </header>

        <main class="space-y-20">
            <section class="space-y-4 max-w-5xl">
                <div class="section-label text-accent">Currently pondering</div>
                <div class="border-l-2 border-accent pl-6 space-y-4">
                    <!-- Title in EB Garamond Bold -->
                    <h2 id="render-focus-title" class="text-4xl md:text-6xl font-bold leading-tight italic text-slate-900 dark:text-white"></h2>
                    <!-- Body in EB Garamond Regular -->
                    <p id="render-focus-desc" class="serif-body text-2xl md:text-3xl text-slate-600 dark:text-zinc-400 leading-relaxed font-normal"></p>
                </div>
            </section>

            <section class="space-y-12">
                <div class="section-label text-accent">Path</div>
                <div class="space-y-12">
	    <!--
                    <div class="grid grid-cols-4 gap-4 pb-12 border-b border-slate-200 dark:border-zinc-900">
                        <div class="text-[11px] font-bold text-accent uppercase tracking-widest pt-3" id="render-current-period"></div>
                        <div class="col-span-3">
                            <h3 class="text-3xl md:text-5xl font-bold text-slate-900 dark:text-white mb-2" id="render-current-org"></h3>
                            <p class="text-slate-500 dark:text-zinc-500 text-2xl font-light italic" id="render-current-role"></p>
                        </div>
                    </div>
	    -->
                    <div class="grid grid-cols-4 gap-4">
                        <div class="text-[11px] font-bold text-slate-400 dark:text-zinc-600 uppercase tracking-widest pt-2">Experience</div>
                        <div class="col-span-3 grid sm:grid-cols-2 gap-12" id="render-experience"></div>
                    </div>
                    <div class="grid grid-cols-4 gap-4">
                        <div class="text-[11px] font-bold text-slate-400 dark:text-zinc-600 uppercase tracking-widest pt-2">Education</div>
                        <div class="col-span-3 grid sm:grid-cols-2 gap-12" id="render-education"></div>
                    </div>
                </div>
            </section>

            <section class="border-t border-slate-200 dark:border-zinc-800 pt-12">
                <div class="section-label text-accent mb-8">Synthesis & Discourse</div>
                <div id="render-resources" class="grid md:grid-cols-2 gap-16"></div>
            </section>
        </main>

        <footer class="mt-24 pt-8 border-t border-slate-200 dark:border-zinc-900 text-[11px] uppercase tracking-[0.2em] font-bold text-slate-400 dark:text-zinc-600 text-center">
            <div>© 2026 Sivaramakrishnan Swaminathan</div>
        </footer>
    </div>

    <script>
        document.getElementById('render-name').textContent = DATA.name;
        const taglineContainer = document.getElementById('render-taglines');
        DATA.taglines.forEach((tag, index) => {
            const span = document.createElement('span'); span.textContent = tag; taglineContainer.appendChild(span);
            if (index < DATA.taglines.length - 1) {
                const separator = document.createElement('span'); separator.className = "text-slate-300 dark:text-zinc-800 mx-3"; separator.textContent = "/"; taglineContainer.appendChild(separator);
            }
        });
        document.getElementById('render-focus-title').textContent = DATA.focus.title;
        document.getElementById('render-focus-desc').textContent = DATA.focus.description;
        document.getElementById('render-photo').src = DATA.photo;
	/* 
	document.getElementById('render-current-org').textContent = DATA.current.org;
        document.getElementById('render-current-role').textContent = DATA.current.role;
        document.getElementById('render-current-period').textContent = DATA.current.period;
	*/
        const renderList = (id, items) => {
            const container = document.getElementById(id);
            items.forEach(item => {
                const div = document.createElement('div'); div.className = "space-y-2";
                div.innerHTML = `<div class="text-[11px] font-bold text-accent uppercase tracking-widest">${item.period}</div><h4 class="font-bold text-2xl text-slate-900 dark:text-white">${item.org}</h4><p class="text-slate-500 dark:text-zinc-500 text-lg font-light italic">${item.role}</p>`;
                container.appendChild(div);
            });
        };
        renderList('render-experience', DATA.experience);
        renderList('render-education', DATA.education);

        const resourceContainer = document.getElementById('render-resources');
        DATA.resources.forEach(item => {
            const div = document.createElement('div'); div.className = "group";
            let linksHtml = item.links ? `<div class="flex flex-wrap gap-x-8 gap-y-4">
                    ${item.links.map(link => `<a href="${link.url}" class="inline-block border-b-2 border-accent text-[12px] font-bold uppercase tracking-widest pb-1 text-slate-900 dark:text-zinc-200 hover:text-accent transition-all">${link.label} →</a>`).join('')}
                </div>` : `<a href="${item.url}" class="inline-block border-b border-accent text-[12px] font-bold uppercase tracking-widest pb-1 text-slate-900 dark:text-zinc-200 hover:text-accent transition-all">Explore →</a>`;
            div.innerHTML = `<h4 class="font-bold text-3xl mb-4 group-hover:text-accent transition-colors text-slate-900 dark:text-white">${item.label}</h4><p class="text-slate-500 dark:text-zinc-400 text-lg leading-relaxed mb-8 font-light">${item.desc}</p>${linksHtml}`;
            resourceContainer.appendChild(div);
        });

        document.getElementById('link-github').href = DATA.socials.github;
        document.getElementById('link-twitter').href = DATA.socials.twitter;
        document.getElementById('link-email').href = DATA.socials.email;
        document.getElementById('link-resume').href = DATA.socials.resume;

        var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        function updateToggleIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            themeToggleLightIcon.classList.toggle('hidden', !isDark);
            themeToggleDarkIcon.classList.toggle('hidden', isDark);
        }
        document.getElementById('theme-toggle').addEventListener('click', function() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('color-theme', isDark ? 'dark' : 'light');
            updateToggleIcons();
        });
        updateToggleIcons();
    </script>
</body>
</html>
